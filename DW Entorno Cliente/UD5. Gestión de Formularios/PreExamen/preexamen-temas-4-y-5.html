<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="ej1.js" defer></script>
    <script src="ej2.js" defer></script>
    <script src="ej3.js" defer></script>
    <script src="ej4.js" defer></script>
    <script src="ej5.js" defer></script>
    <script src="ej6.js" defer></script>
    <script src="ej7.js" defer></script>
    <script src="ej8.js" defer></script>
    <script src="ej9.js" defer></script>
    <script src="ej10.js" defer></script>
  </head>
  <body>
    <h2>1. Stock</h2>
    <p class="stock">Jazz</p>
    <p class="stock">Rock</p>
    <p class="stock">Pop</p>

    <h2>2. Contador</h2>
    <button id="menos">-</button>
    <span id="total">0</span>
    <button id="mas">+</button>

    <h2>3. Buscador</h2>
    <input id="busqueda" type="text" />
    <ul id="lista">
      <li>Jazz</li>
      <li>Rock</li>
      <li>Jazz latino</li>
    </ul>

    <h2>4. Discos</h2>
    <ul id="discos"></ul>

    <h2>5. Borrar elementos</h2>
    <ul id="lista5">
      <li>
        Jazz <button class="borrar"><span>×</span></button>
      </li>
      <li>
        Rock <button class="borrar"><span>×</span></button>
      </li>
    </ul>
    <p id="total5"></p>

    <h2>6. Reserva</h2>
    <form id="reserva" novalidate>
      <label>Nombre <input id="nombre" /></label>
      <span id="errNombre"></span>
      <label>Ciudad <input id="ciudad" /></label>
      <span id="errCiudad"></span>
      <button type="submit">Reservar</button>
    </form>
    <p id="aviso"></p>

    <h2>7. Cantidad</h2>
    <input id="cantidad" type="number" />
    <label><input id="socio" type="checkbox" /> Soy socio</label>
    <button id="comprobar">Comprobar</button>
    <p id="error"></p>

    <h2>8. Envío</h2>
    <select id="envio">
      <option value="recogida">Recogida</option>
      <option value="domicilio">Domicilio</option>
    </select>
    <label><input id="socio8" type="checkbox" /> Soy socio</label>
    <p id="precio"></p>

    <h2>9. Código (F12 → Consola)</h2>

    <h2>10. Alias</h2>
    <form id="alta" novalidate>
      <label
        >Alias <input id="alias" required pattern="[A-Za-z][A-Za-z0-9_]{3,11}"
      /></label>
      <button type="submit">Crear cuenta</button>
    </form>
    <p id="resultado"></p>
  </body>
</html>
