<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>No debiste entrar | Museum 404</title>

    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/juego.css" />

    <script src="js/juego.js" defer></script>
  </head>

  <body class="pagina-juego">
    <!-- ==========================================
         CABECERA
    =========================================== -->



    <!-- ==========================================
         CONTENIDO PRINCIPAL
    =========================================== -->
    <div class="sala-del-juego">
      <a href="index.html" class="placa-volver" aria-label="Volver al museo">
        <img src="assets/img/otros/placa-izq-museo.png" alt="Volver al museo">
      </a>
      <main class="contenedor-juego">
        <!-- PANTALLA DEL JUEGO -->
        <section class="pantalla-juego" aria-label="Juego de terror">
          <!-- INTRODUCCIÓN -->
          <div id="pantalla-inicio" class="escena-juego">
            <h2>NO DEBISTE ENTRAR</h2>

            <p>1986. Una carretera desierta. Tu coche acaba de averiarse.</p>

            <p>
              A lo lejos distingues una casa. Parece abandonada, pero hay una
              luz encendida.
            </p>

            <p>Necesitas ayuda. Aunque algo te dice que deberías marcharte.</p>

            <button id="iniciar-juego" type="button">COMENZAR</button>
          </div>

          <!-- ESCENA PRINCIPAL -->
          <div id="pantalla-historia" class="escena-juego" hidden>
            <h2 id="cartel-sala" class="cartel-sala"></h2>

            <!-- IMAGEN DE LA ESCENA -->
            <div class="imagen-escena">
              <img id="imagen-escena" src="" alt="Escena actual del juego" />
            </div>

            <!-- TEXTO NARRATIVO -->
            <div class="texto-historia">
              <p id="texto-escena"></p>
            </div>

            <!-- DECISIONES -->
            <div class="opciones-historia" id="opciones-escena"></div>
            <nav id="navegacion-opciones" aria-label="Más acciones" hidden>
              <button id="opciones-anteriores" type="button">← Anteriores</button>
              <span id="numero-opciones" aria-live="polite"></span>
              <button id="opciones-siguientes" type="button">Más opciones →</button>
            </nav>
          </div>

          <!-- INVENTARIO -->
          <aside class="inventario-juego">
            <p id="estado-vidas" aria-live="polite">Vidas: 2 de 2</p>
            <h3>INVENTARIO</h3>

            <div id="inventario">Inventario vacío</div>
          </aside>
        </section>
      </main>

      <div class="controles-partida">
        <button id="btn-guardar" type="button" aria-label="Guardar"><img src="assets/img/otros/placa-guardar.png" alt="Guardar"></button>
        <button id="btn-cargar" type="button" aria-label="Cargar"><img src="assets/img/otros/placa-cargar.png" alt="Cargar"></button>
        <button id="btn-reiniciar" type="button" aria-label="Nueva partida"><img src="assets/img/otros/placa-nueva-partida.png" alt="Nueva partida"></button>
      </div>
    </div>

    <dialog id="aviso-juego" aria-labelledby="titulo-aviso">
      <h2 id="titulo-aviso"></h2>
      <div class="lectura-aviso">
        <img id="imagen-aviso" alt="" />
        <p id="fragmento-aviso" hidden></p>
      </div>

      <div id="controles-casete" hidden>
        <audio id="audio-casete" preload="none"></audio>
        <button id="play-casete" type="button">▶ Reproducir</button>
        <button id="stop-casete" type="button">■ Detener</button>
      </div>
      <form method="dialog">
        <button type="submit" autofocus>Continuar</button>
      </form>
    </dialog>

    <!-- ==========================================
         PIE DE PÁGINA
    =========================================== -->


  </body>
</html>
