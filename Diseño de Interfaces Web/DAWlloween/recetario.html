<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recetario de Bruja | Museum 404</title>

    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/recetario.css" />

    <script src="js/recetario.js" defer></script>
  </head>

  <body class="pagina-recetario">
    <!-- CABECERA -->
    <header class="cabecera-recetario">
      <a href="index.html" class="volver-museo" aria-label="Volver al museo">
        &#8592;
      </a>

      <div class="titulo-recetario">
        <h1>RECETARIO DE BRUJA</h1>
        <p>Recetas recuperadas de los archivos prohibidos</p>
      </div>
    </header>

    <main class="escenario-recetario">
      <!-- LIBRO -->
      <section class="libro" aria-label="Libro de recetas de Halloween">
        <!-- PORTADA DEL RECETARIO -->
        <div class="pagina-libro portada-libro activa" id="portada">
          <button
            class="abrir-libro"
            id="abrir-libro"
            type="button"
            aria-label="Abrir el libro de recetas"
          >
            <img
              src="assets/img/recetario/recetario.png"
              alt="Libro de recetas de bruja"
              class="imagen-libro"
            />
          </button>
        </div>

        <!-- ÍNDICE -->
        <div class="pagina-libro pagina-interior" id="indice" hidden>
          <div class="selector-recetas">
            <button
              type="button"
              id="tarjeta-anterior"
              class="flecha-indice"
              aria-label="Mostrar la receta anterior"
            >
              ←
            </button>

            <div class="lista-recetas"></div>

            <button
              type="button"
              id="tarjeta-siguiente"
              class="flecha-indice"
              aria-label="Mostrar la receta siguiente"
            >
              →
            </button>
          </div>

          <button type="button" id="abrir-indice-completo">
            Ver índice completo
          </button>

          <div class="pagina-libro pagina-interior" id="indice"
     role="region" aria-label="Índice de recetas" hidden>
        </div>

        <!-- PÁGINA DE RECETA -->

        <section
          id="indice-completo"
          class="pagina-libro pagina-interior"
          hidden
        >
          <h2>Índice completo</h2>

          <ol id="lista-indice-completo"></ol>

          <button type="button" id="volver-a-tarjetas">
            Volver a las tarjetas
          </button>
        </section>
        <div class="pagina-libro pagina-interior" id="pagina-receta" hidden>
            <button type="button" id="volver-al-indice">← Volver al índice</button>
          <h2 id="nombre-receta"></h2>

          <div class="imagen-receta">
            <img id="foto-receta" src="" alt="" />
          </div>

          <div class="contenido-receta">
            <section class="ingredientes">
              <h3>INGREDIENTES</h3>
              <ul id="lista-ingredientes"></ul>
            </section>

            <section class="preparacion">
              <h3>PREPARACIÓN</h3>
              <ol id="lista-pasos"></ol>
            </section>
          </div>
        </div>

        <!-- NAVEGACIÓN DEL LIBRO -->
        <nav
          class="navegacion-libro"
          id="navegacion-libro"
          aria-label="Navegación entre páginas"
          hidden
        >
          <button
            id="pagina-anterior"
            class="flecha-libro"
            type="button"
            aria-label="Página anterior"
          >
            &#8592;
          </button>

          <span id="numero-pagina" aria-live="polite"></span>

          <button
            id="pagina-siguiente"
            class="flecha-libro"
            type="button"
            aria-label="Página siguiente"
          >
            &#8594;
          </button>
        </nav>
      </section>
    </main>

    <footer class="pie-recetario">
      <p>Museum 404: Not Found — Archivo de recetas prohibidas</p>
    </footer>
  </body>
</html>
