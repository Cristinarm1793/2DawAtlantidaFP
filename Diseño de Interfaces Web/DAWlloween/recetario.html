<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recetario de Bruja | Museum 404</title>

    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/recetario.css" />

    <script type="module" src="js/recetario.js"></script>
  </head>

  <body class="pagina-recetario">
    <!-- CABECERA -->
    <header class="cabecera-recetario">
      <a href="index.html" class="volver-museo">
        <img src="assets/img/otros/placa-der-museo.png" alt="Volver al museo" />
      </a>
    </header>

    <main class="escenario-recetario">
      <h1 class="titulo-recetario-accesible">Recetario de las brujas</h1>
      <!-- LIBRO -->
      <section class="libro" aria-label="Libro de recetas de Halloween">
        <div class="pagina-libro portada-libro activa" id="portada">
          <button
            class="abrir-libro"
            id="abrir-libro"
            type="button"
            aria-label="Abrir el libro de recetas"
          >
            <img
              src="assets/img/recetario/recetario.png"
              alt="Libro de recetas de bruja"
              class="imagen-libro"
            />
          </button>
        </div>

        <!-- ÍNDICE -->
        <div class="pagina-libro pagina-interior" id="indice" hidden>
          <div class="selector-recetas">
            <button
              type="button"
              id="tarjeta-anterior"
              class="flecha-indice"
              aria-label="Mostrar la receta anterior"
            >
              ←
            </button>

            <div class="lista-recetas"></div>

            <button
              type="button"
              id="tarjeta-siguiente"
              class="flecha-indice"
              aria-label="Mostrar la receta siguiente"
            >
              →
            </button>
          </div>

          <button type="button" id="abrir-indice-completo">
            Ver índice completo
          </button>
        </div>

        <!-- PÁGINA DE RECETA -->

        <section
          id="indice-completo"
          class="pagina-libro pagina-interior"
          hidden
        >
          <h2>Índice completo</h2>

          <ol id="lista-indice-completo"></ol>

          <button type="button" id="volver-a-tarjetas">
            ← Volver a las tarjetas
          </button>
        </section>
        <div class="pagina-libro pagina-interior" id="pagina-receta" hidden>
          <h2 id="nombre-receta"></h2>

          <div class="imagen-receta">
            <img id="foto-receta" alt="" />
          </div>

          <div class="contenido-receta">
            <section class="ingredientes">
              <h3>Ingredientes</h3>
              <ul id="lista-ingredientes"></ul>
            </section>

            <section class="preparacion">
              <h3>Preparación</h3>
              <ol id="lista-pasos"></ol>
            </section>
          </div>

          <nav
            class="navegacion-libro"
            id="navegacion-libro"
            aria-label="Navegación entre recetas"
            hidden
          >
            <button
              class="flecha-libro"
              id="pagina-anterior"
              type="button"
              aria-label="Receta anterior"
            >
              ←
            </button>

            <button id="volver-al-indice" type="button">
              Volver al índice
            </button>

            <button
              class="flecha-libro"
              id="pagina-siguiente"
              type="button"
              aria-label="Receta siguiente"
            >
              →
            </button>

            <span id="numero-pagina" aria-live="polite"></span>
          </nav>
        </div>
      </section>
    </main>

    <footer class="pie-recetario">
      <p>Museum 404: Not Found — Archivo de recetas prohibidas</p>
    </footer>
  </body>
</html>
