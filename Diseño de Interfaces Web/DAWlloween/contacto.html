<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacta con Jack Skellington | Museum 404</title>
    <link rel="stylesheet" href="css/contactanos.css" />
    <script src="js/comunicacion.js" defer></script>
    <script src="js/contacto.js" defer></script>
  </head>
  <body class="pagina-contacto">
    <main class="escenario-contacto">
      <section class="carta-jack" aria-labelledby="titulo-jack">
        <div class="contenido-carta">
          <h1 id="titulo-jack">Contacta con<br />Jack Skellington</h1>
          <p>
            Jack es nuestro gerente del museo. Atiende tus consultas,
            sugerencias y avisos sobre anomalías. Déjale tu mensaje.
          </p>
          <div id="respuesta-contacto" aria-live="polite" tabindex="-1"></div>
          <p id="acceso-contacto">
            Para escribir a Jack,
            <a href="perfil.html#login">inicia sesión</a> o
            <a href="perfil.html#registro">crea tu cuenta</a>.
          </p>
          <p id="remitente-contacto" hidden></p>
          <form
            id="formulario-contacto"
            action="php/correo.php"
            method="post"
            hidden
          >
            <label for="asunto">Asunto</label>
            <select id="asunto" name="asunto" required>
              <option value="">Selecciona un asunto</option>
              <option value="consulta">Consulta general</option>
              <option value="anomalia">Informar de una anomalía</option>
              <option value="sugerencia">Sugerencia para el museo</option>
              <option value="otro">Otro asunto</option>
            </select>
            <label for="mensaje">Tu mensaje</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              maxlength="3000"
              required
              placeholder="Querido Jack…"
            ></textarea>
            <div class="acciones-carta">
              <button type="reset">Borrar</button
              ><button type="submit">Enviar a Jack</button>
            </div>
          </form>
          <noscript>Activa JavaScript para escribir a Jack.</noscript>
        </div>
        <a class="regreso-carta" href="index.html"
          ><svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 11 12 3l9 8M5 10v11h5v-7h4v7h5V10" />
          </svg>
          Volver al museo</a
        >
      </section>
    </main>
  </body>
</html>
